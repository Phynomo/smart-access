<!-- Menú del usuario (popup) -->
<p-menu
  #userMenu
  [model]="menuItems"
  [popup]="true"
  styleClass="user-menu">

  <!-- Cabecera con nombre y rol del usuario -->
  <ng-template #start>
    @if (user(); as u) {
      <div class="px-4 pt-3 pb-2 border-surface-200 border-b">
        <p class="font-semibold text-color text-sm leading-tight">{{ u.name }}</p>
        <p class="mt-0.5 text-muted-color text-xs capitalize">{{ u.role }}</p>
      </div>
    }
  </ng-template>

</p-menu>

<header id="header" class="safe-top flex justify-between items-center bg-slate-900 dark:bg-slate-950 px-4 shrink-0">

  <!-- Logo + Nombre -->
  <div class="flex items-center gap-2.5">
    <img src="icon.svg" alt="Smart Access" class="shadow-md shadow-primary/50 rounded-lg w-9 h-9" />
    <div>
      <p class="font-semibold text-white text-sm leading-none tracking-tight">Smart Access</p>
      <p class="mt-0.5 text-[11px] text-slate-400 leading-none">Control de Acceso</p>
    </div>
  </div>

  <!-- Acciones -->
  <div class="flex items-center gap-0.5">

    <!-- Toggle tema -->
    <button
      type="button"
      (click)="theme.toggle()"
      class="flex justify-center items-center hover:bg-slate-800 dark:hover:bg-slate-700 rounded-xl w-9 h-9 transition-colors"
      [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <i class="text-slate-400 text-base transition-all pi"
        [class.pi-moon]="!theme.isDark()"
        [class.pi-sun]="theme.isDark()"></i>
    </button>

    <!-- Notificaciones (solo residentes) -->
    @if (isResident()) {
      <a routerLink="/notificaciones"
        type="button"
        class="relative flex justify-center items-center hover:bg-slate-800 dark:hover:bg-slate-700 rounded-xl w-9 h-9 transition-colors">
        <i class="text-slate-400 text-base pi pi-bell"></i>
        @if (unreadCount() > 0) {
          <span class="top-1.5 right-1.5 absolute bg-primary border-2 border-slate-900 dark:border-slate-950 rounded-full w-2 h-2"></span>
        }
      </a>
    }

    <!-- Avatar → abre menú de usuario -->
    <button
      type="button"
      (click)="userMenu.toggle($event)"
      class="flex justify-center items-center bg-primary hover:bg-primary-600 ml-1 rounded-xl w-9 h-9 transition-colors cursor-pointer"
      title="Opciones de cuenta">
      <span class="font-bold text-white text-xs select-none">{{ initials() }}</span>
    </button>

  </div>
</header>
